workflows:
  ios-unsigned:
    name: Bridely iOS (unsigned, Sideloadly ile kurulum için)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Bağımlılıkları kur
        script: flutter pub get
      - name: CocoaPods kur
        script: cd ios && pod install && cd ..
      - name: Flutter framework/config üret (hata verse de devam, sadece Generated.xcconfig için)
        script: flutter build ios --release --no-codesign || true
      - name: xcodebuild ile imzasız, tam derleme
        script: |
          set -e
          rm -rf build/ios_derived
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_derived \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            build
      - name: Runner.app'i bul, doğrula ve imzasız .ipa oluştur
        script: |
          set -e
          CANDIDATE=$(find build/ios_derived/Build/Products -maxdepth 2 -name "Runner.app" 2>/dev/null | head -1)

          if [ -z "$CANDIDATE" ] || [ ! -f "$CANDIDATE/Info.plist" ]; then
            echo "HATA: Info.plist içeren geçerli bir Runner.app bulunamadı."
            echo "build/ios_derived altındaki tüm .app'ler:"
            find build/ios_derived -iname "Runner.app" 2>/dev/null
            exit 1
          fi

          echo "Kullanılan .app: $CANDIDATE"
          ls "$CANDIDATE"

          mkdir -p build/ios/iphoneos/Payload
          rm -rf build/ios/iphoneos/Payload/Runner.app
          cp -r "$CANDIDATE" build/ios/iphoneos/Payload/Runner.app

          if [ ! -f "build/ios/iphoneos/Payload/Runner.app/Info.plist" ]; then
            echo "HATA: Kopyalanan Runner.app içinde Info.plist yok."
            exit 1
          fi

          cd build/ios/iphoneos
          rm -f bridely-unsigned.ipa
          zip -r bridely-unsigned.ipa Payload
          unzip -l bridely-unsigned.ipa | head -20
    artifacts:
      - build/ios/iphoneos/bridely-unsigned.ipa
