workflows:
  ios-unsigned:
    name: Bridely iOS (unsigned, Sideloadly ile kurulum için)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Bağımlılıkları kur
        script: flutter pub get
      - name: iOS için imzasız build al
        script: flutter build ios --release --no-codesign
      - name: Payload'dan imzasız .ipa oluştur
        script: |
          set -e
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r bridely-unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/bridely-unsigned.ipa
